
<div class="paper {{themeCls}}" style="width:1280px;height:900px;position:relative;overflow:hidden">
<dc-import name="D-Hoje" escuro="{{dark}}" hint-size="1280px,1420px"></dc-import>
<div class="dim"></div>
<div style="position:absolute;left:0;right:0;top:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px">
  <section class="modal" role="dialog" aria-label="Novo item" style="width:560px;padding:26px 28px 24px">
    <div class="row jb" style="margin-bottom:14px">
      <h2 class="ser" style="font-size:28px;font-weight:600">Novo item</h2>
      <a class="btn btn-g btn-ic" href="D-Hoje.dc.html" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
    <div class="tabs" role="tablist" aria-label="Tipo de item">
      <button class="tab on" role="tab" aria-selected="true">Compromisso</button>
      <button class="tab" role="tab" aria-selected="false">Tarefa</button>
      <button class="tab" role="tab" aria-selected="false">Nota</button>
      <button class="tab" role="tab" aria-selected="false">Lembrete</button>
    </div>
    <div class="col g16" style="margin-top:18px">
      <div><label class="lbl" for="tit">Título</label><input id="tit" class="inp" type="text" value="Consulta no dentista"></div>
      <div class="row g12 as">
        <div style="flex:1.6;min-width:0"><span class="lbl">Data</span><button class="inp sel" aria-label="Data: quinta, 5 de novembro"><span class="row g8"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3"></rect><path d="M8 3.5v4M16 3.5v4M4 10h16"></path></svg>quinta, 5 de novembro</span></button></div>
        <div class="f1"><label class="lbl" for="ini">Início</label><input id="ini" class="inp num" type="text" value="09:00"></div>
        <div class="f1"><label class="lbl" for="fim">Fim</label><input id="fim" class="inp num" type="text" value="09:45"></div>
      </div>
      <div>
        <span class="lbl" style="margin-bottom:0">Cor</span>
        <div class="row" style="gap:6px;margin-left:-4px" role="radiogroup" aria-label="Cor do item">
          <button class="sw c-sky" role="radio" aria-checked="false" aria-label="Azul-céu"><i></i></button>
          <button class="sw c-lav" role="radio" aria-checked="false" aria-label="Lavanda"><i></i></button>
          <button class="sw c-peach" role="radio" aria-checked="false" aria-label="Pêssego"><i></i></button>
          <button class="sw c-sage" role="radio" aria-checked="false" aria-label="Verde-sálvia"><i></i></button>
          <button class="sw c-rose on" role="radio" aria-checked="true" aria-label="Rosa"><i></i></button>
          <button class="sw c-sand" role="radio" aria-checked="false" aria-label="Areia"><i></i></button>
        </div>
      </div>
      <div class="row g12 as">
        <div class="f1"><span class="lbl">Repetição</span><button class="inp sel" aria-label="Repetição: não repete"><span class="row g8"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11V9.5A2.5 2.5 0 016.5 7H19l-3-3M20 13v1.5a2.5 2.5 0 01-2.5 2.5H5l3 3"></path></svg>Não repete</span><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
        <div class="f1"><span class="lbl">Lembrete</span><button class="inp sel" aria-label="Lembrete: 15 minutos antes"><span class="row g8"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0112 0v5.5l1.5 1.5h-15z"></path><path d="M10 20.5a2.2 2.2 0 004 0"></path></svg>15 min antes</span><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
      </div>
      <div><label class="lbl" for="not">Notas</label><textarea id="not" class="inp" placeholder="Endereço, o que levar, perguntas…" style="min-height:76px"></textarea></div>
      <div class="row jb" style="margin-top:2px">
        <span class="xs t3 b row g6"><span class="kbd">Esc</span> fecha · <span class="kbd">Enter</span> salva</span>
        <div class="row g8"><a class="btn btn-s" href="D-Hoje.dc.html">Cancelar</a><a class="btn btn-p" href="D-Hoje.dc.html">Salvar compromisso</a></div>
      </div>
    </div>
  </section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;escuro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Tema&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() { return { dark: !!this.props.escuro, themeCls: this.props.escuro ? 'dk' : '' }; }
}
</script>
</body></html>
