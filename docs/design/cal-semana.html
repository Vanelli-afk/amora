  <section class="card" style="padding:0;overflow:hidden" aria-label="Agenda da semana">
    <!-- Cabeçalho dos dias -->
    <div class="row as" style="border-bottom:1.5px solid var(--line)">
      <div style="width:56px;flex:none"></div>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div class="col" style="flex:1 1 0;min-width:0;align-items:center;gap:2px;padding:10px 4px 8px;border-left:1.5px dashed var(--line)">
          <span class="xs b t2" style="text-transform:uppercase;letter-spacing:.08em">{{d.n}}</span>
          <span class="dn {{d.dn}}" style="width:34px;height:34px;font-size:20px">{{d.d}}</span>
          <span class="xs b" style="min-height:18px;color:var(--coral-ink)">{{d.allday}}</span>
        </div>
      </sc-for>
    </div>
    <!-- Grade de horas -->
    <div class="row as" style="padding-top:12px">
      <div style="width:56px;flex:none;padding-top:0">
        <sc-for list="{{hours}}" as="h" hint-placeholder-count="15"><div class="xs b t3 num" style="height:48px;padding-right:8px;text-align:right;transform:translateY(-8px)">{{h}}</div></sc-for>
      </div>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="position:relative;flex:1 1 0;min-width:0;height:720px;border-left:1.5px dashed var(--line);background-image:repeating-linear-gradient(transparent 0 47px,var(--line2) 47px 48px);{{d.bg}}">
          <sc-for list="{{d.evs}}" as="e" hint-placeholder-count="2">
            <a class="ev {{e.c}}" href="D-Detalhe.dc.html" style="left:4px;right:4px;padding:3px 8px;{{e.pos}}"><b style="font-size:13px">{{e.t}}</b><span>{{e.sub}}</span></a>
          </sc-for>
          <sc-if value="{{d.now}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:0;right:0;top:562px;height:2px;background:var(--coral);z-index:2"><span class="now" style="position:absolute;left:4px;top:-10px">19:42</span></div></sc-if>
        </div>
      </sc-for>
    </div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;escuro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Tema&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:960}}">
class Component extends DCLogic {
  renderVals() {
    const H0 = 8, PX = 48;
    function f(h) { const m = Math.round((h % 1) * 60); return ('0' + Math.floor(h)).slice(-2) + ':' + ('0' + m).slice(-2); }
    function ev(s, e, t, c) {
      return { t: t, c: c, sub: (e - s) >= 1 ? f(s) + ' – ' + f(e) : '', pos: 'top:' + ((s - H0) * PX) + 'px;height:' + Math.max(26, (e - s) * PX - 2) + 'px' };
    }
    const days = [
      { n: 'dom', d: '1', dn: '', allday: '', evs: [] },
      { n: 'seg', d: '2', dn: '', allday: 'Finados', evs: [] },
      { n: 'ter', d: '3', dn: '', allday: '', evs: [ev(18.5, 19.5, 'Yoga', 'c-sage')] },
      { n: 'qua', d: '4', dn: 't', allday: '', now: true, bg: 'background-color:var(--coral-soft);', evs: [
        ev(8.5, 9, 'Ligar para a vovó', 'c-rose'), ev(9.5, 10.5, 'Reunião de alinhamento', 'c-sky'), ev(10.5, 12, 'Foco: relatório', 'c-lav'),
        ev(12.5, 13.5, 'Almoço com a Bia', 'c-peach'), ev(15, 16, 'Revisão da semana', 'c-sage'), ev(21.5, 22.5, 'Noite sem telas', 'c-sand') ] },
      { n: 'qui', d: '5', dn: '', allday: '', evs: [ev(9, 9.75, 'Dentista', 'c-rose'), ev(14, 15.5, 'Foco profundo', 'c-lav')] },
      { n: 'sex', d: '6', dn: '', allday: '', evs: [ev(8, 10, 'Feira', 'c-sage'), ev(19, 21, 'Jantar com amigos', 'c-peach')] },
      { n: 'sáb', d: '7', dn: '', allday: '', evs: [ev(10, 12, 'Preparar a festa', 'c-sand'), ev(19, 22, 'Aniversário da Bia', 'c-peach')] }
    ];
    const hours = [];
    for (let h = 8; h <= 22; h++) hours.push(('0' + h).slice(-2) + ':00');
    return { days: days, hours: hours, themeCls: this.props.escuro ? 'dk' : '' };
  }
}
</script>
