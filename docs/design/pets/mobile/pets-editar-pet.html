<!DOCTYPE html>
<html lang="pt-BR"><head>

<style>/* Casa em Dia · estilos compartilhados (Finanças + Pets) */
:root{
  --bg:#F8F2E7;--bg2:#F1E8D8;--surf:#FFFDF8;--surf2:#F5ECDC;--line:#E4D8C0;--line2:#EEE5D0;
  --tx:#403630;--tx2:#5E5249;--tx3:#75675C;
  --ac:#2F6650;--ac-d:#245140;--ac-soft:#DCEADF;
  --pos:#2A5D49;--neg:#A4452F;--neg-soft:#F6DBD1;--warn:#C58B16;--warn-ink:#8A5A00;--warn-soft:#FBEAB8;
  --sky:#D3E5F2;--sky-e:#86B3D3;--lav:#E1D8F2;--lav-e:#AB9CD8;--peach:#FADFC8;--peach-e:#E9A77A;
  --sage:#D5E5CF;--sage-e:#8FB585;--rose:#F6D5DB;--rose-e:#E39BAA;--sand:#EBDFC4;--sand-e:#CDB57F;
  --k1:#3E6E8E;--k2:#D98550;--k3:#6E9A63;--k4:#8D78C4;--k5:#D6728A;--k6:#B79A4E;
  --sh:0 1px 2px rgba(64,54,48,.06),0 6px 18px rgba(64,54,48,.07);
  --sh2:0 2px 4px rgba(64,54,48,.08),0 18px 44px rgba(64,54,48,.16);
  --focus:#2F6F9F;--ease:cubic-bezier(.2,.7,.3,1);
}
.pets{--ac:#B04F2C;--ac-d:#923F20;--ac-soft:#F9DECE}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.45;font-weight:600;color:var(--tx);background:var(--bg);position:relative;overflow:hidden}
.mob{width:390px;display:flex;flex-direction:column}
.mob>*:not(.blob){position:relative;z-index:1}
.blob{position:absolute;z-index:0;pointer-events:none;border-radius:62% 38% 55% 45%/48% 58% 42% 52%}
.fin .blob.b1{background:#D9E8DC;width:300px;height:260px;right:-110px;top:-90px}
.fin .blob.b2{background:#F4E3B8;width:200px;height:190px;left:-90px;top:340px;opacity:.55}
.pets .blob.b1{background:#F9DDC9;width:300px;height:260px;right:-110px;top:-90px}
.pets .blob.b2{background:#E3DAF1;width:200px;height:190px;left:-90px;top:340px;opacity:.6}

/* tipografia */
.ser{font-family:'Fraunces',Georgia,serif}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)}
.h1{font:600 28px/1.15 'Fraunces',serif;margin:0}
.h2{font:600 21px/1.25 'Fraunces',serif;margin:0}
.h3{font:800 16px/1.3 'Nunito',sans-serif;margin:0}
.sm{font-size:14px}.xs{font-size:12px}.b{font-weight:800}
.t2{color:var(--tx2)}.t3{color:var(--tx3)}.tr{text-align:right}.tc{text-align:center}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* layout */
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.wrap{flex-wrap:wrap}.jb{justify-content:space-between}.f1{flex:1;min-width:0}.nf{flex:none}
.as{align-items:flex-start}.ae{align-items:flex-end}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pg{padding:4px 16px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 16px 10px}
.top .ttl{min-width:0}

/* superfícies */
.card{background:var(--surf);border:1.5px solid var(--line2);border-radius:22px;box-shadow:var(--sh);padding:16px}
.card.lg{padding:20px}
.card.flat{box-shadow:none;background:var(--surf2)}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.link{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:800;font-size:14px;color:var(--ac-d);text-decoration:none}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surf);border:1.5px solid var(--line2);box-shadow:var(--sh);color:var(--tx);text-decoration:none;flex:none;cursor:pointer}
.hero{position:relative;overflow:hidden;background:var(--ac);color:#fff;border-radius:28px;padding:20px 22px;box-shadow:var(--sh2)}
.hero::before{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::after{content:"";position:absolute;right:40px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero>*{position:relative;z-index:1}
.hero .lab{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.92}
.hero .big{font:600 42px/1.05 'Fraunces',serif;margin-top:4px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:14px;font-weight:700;opacity:.95;margin-top:6px}
.stat{padding:14px 16px}
.stat .v{font:600 22px/1.15 'Fraunces',serif;font-variant-numeric:tabular-nums;margin-top:2px}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--cbg,var(--surf2));border:1.5px solid var(--ce,var(--line));flex:none;color:var(--tx)}
.ico.r{border-radius:50%}
.c-sky{--cbg:var(--sky);--ce:var(--sky-e)}.c-lav{--cbg:var(--lav);--ce:var(--lav-e)}.c-peach{--cbg:var(--peach);--ce:var(--peach-e)}
.c-sage{--cbg:var(--sage);--ce:var(--sage-e)}.c-rose{--cbg:var(--rose);--ce:var(--rose-e)}.c-sand{--cbg:var(--sand);--ce:var(--sand-e)}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}.i.l{width:26px;height:26px}.i.xl{width:32px;height:32px}

/* listas */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1.5px dashed var(--line);min-height:64px;text-decoration:none;color:inherit}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-weight:800;line-height:1.25}
.li .mid span{display:block;font-size:13px;color:var(--tx3);line-height:1.3}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.day{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding:8px 2px 0}

/* selos, chips, abas */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;line-height:1.35;background:var(--surf2);color:var(--tx2);white-space:nowrap}
.b-ok{background:#DCEADF;color:#1F4F3C}.b-warn{background:var(--warn-soft);color:var(--warn-ink)}.b-bad{background:var(--neg-soft);color:#8E3622}.b-info{background:var(--sky);color:#2B4C66}.b-ac{background:var(--ac-soft);color:var(--ac-d)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:999px;background:var(--surf);border:1.5px solid var(--line);font-weight:800;font-size:14px;color:var(--tx2);white-space:nowrap;text-decoration:none;cursor:pointer}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.hs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px}
.seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:var(--surf2);border:1.5px solid var(--line2)}
.seg>*{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 10px;border-radius:14px;font-weight:800;font-size:14px;color:var(--tx2);text-decoration:none;white-space:nowrap;border:0;background:transparent;cursor:pointer}
.seg>.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabs>*{display:inline-flex;align-items:center;min-height:48px;padding:0 14px;font-weight:800;font-size:15px;color:var(--tx3);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs>.on{color:var(--ac-d);border-bottom-color:var(--ac)}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:15px;border:1.5px solid transparent;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-p{background:var(--ac);color:#fff}.btn-s{background:var(--surf);border-color:var(--line);color:var(--tx)}
.btn-g{background:transparent;color:var(--ac-d)}.btn-d{background:transparent;border-color:var(--neg);color:var(--neg)}
.btn-dp{background:var(--neg);color:#fff}.btn-w{width:100%}.btn-sm{min-height:44px;padding:0 14px;font-size:14px}
.fab{width:60px;height:60px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(64,54,48,.3);text-decoration:none;border:0}
.fab.ext{width:auto;padding:0 20px 0 16px;border-radius:30px;gap:8px;display:inline-flex;align-items:center;font-weight:800}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--tx2);margin-bottom:6px}
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);font-size:16px;font-weight:600;color:var(--tx);display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
textarea.inp{padding:12px 14px;min-height:92px;display:block}
.inp.err{border-color:var(--neg);background:#FFF8F5}
.errmsg{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px;font-weight:800;color:#8E3622}
.hint{margin-top:6px;font-size:13px;color:var(--tx3)}
.inw{position:relative}.inw .i{position:absolute;left:14px;top:13px;color:var(--tx3)}.inw .inp{padding-left:44px}
.tg{position:relative;width:52px;height:32px;border-radius:99px;background:#CDBF9F;border:0;flex:none;padding:0;cursor:pointer}
.tg::after{content:"";position:absolute;inset:-7px -2px}
.tg i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s var(--ease)}
.tg.on{background:var(--ac)}.tg.on i{left:24px}
.ck{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border-radius:9px;border:2px solid var(--tx3);background:var(--surf);position:relative;cursor:pointer}
.ck:checked{background:var(--ac);border-color:var(--ac)}
.ck:checked::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.sw{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;cursor:pointer}
.sw i{display:block;width:30px;height:30px;border-radius:50%;background:var(--cbg);border:2px solid var(--ce)}
.sw.on{box-shadow:0 0 0 2px var(--surf),0 0 0 4px var(--tx)}

/* barras de progresso e gráficos */
.prog{height:10px;border-radius:99px;background:var(--line2);border:1.5px solid var(--line);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.prog.warn>i{background:var(--warn)}.prog.bad>i{background:var(--neg)}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;flex:none}
.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}.k4{background:var(--k4)}.k5{background:var(--k5)}.k6{background:var(--k6)}
.chart text{font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;fill:var(--tx3)}

/* menu inferior e sobreposições */
.bn{display:flex;align-items:stretch;background:var(--surf);border-top:1.5px solid var(--line2);box-shadow:0 -6px 22px rgba(64,54,48,.07);padding:6px 6px 14px}
.bn a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:16px;font-size:12px;font-weight:800;color:var(--tx3);text-decoration:none}
.bn a.on{color:var(--ac-d)}
.bn a.on .pill{background:var(--ac-soft)}
.bn .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}
.dim{position:absolute;inset:0;z-index:20;background:rgba(64,54,48,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surf);border-radius:28px 28px 0 0;padding:10px 20px 24px;box-shadow:0 -10px 40px rgba(64,54,48,.22)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.modal{background:var(--surf);border-radius:26px;box-shadow:var(--sh2);padding:24px}
.dlg{position:absolute;z-index:22;left:20px;right:20px;top:50%;transform:translateY(-50%)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 20px;border:2px dashed var(--line);border-radius:22px;background:var(--surf)}

/* desktop */
.dsk{display:flex;flex-wrap:wrap;min-height:100vh}
.side-w{flex:0 0 248px;background:var(--surf);border-right:1.5px solid var(--line2);padding:24px 16px;display:flex;flex-direction:column}
.main-w{flex:999 1 600px;min-width:0;position:relative;overflow:hidden;padding:32px 40px 48px}
.main-w>*{position:relative;z-index:1}
.sl{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:15px;font-weight:800;font-size:15px;color:var(--tx2);text-decoration:none}
.sl.on{background:var(--ac-soft);color:var(--ac-d)}
.sl:hover{background:var(--surf2)}
.mod{display:flex;gap:4px;padding:4px;border-radius:18px;background:var(--surf2);border:1.5px solid var(--line2)}
.mod a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:14px;font-weight:800;font-size:14px;color:var(--tx2);text-decoration:none}
.mod a.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}
.dh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.dg{display:grid;gap:16px}
.dg.c12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.th{display:grid;align-items:center;gap:12px;padding:0 4px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);border-bottom:1.5px solid var(--line)}
.tr-row{display:grid;align-items:center;gap:12px;padding:10px 4px;border-bottom:1.5px dashed var(--line);min-height:60px}
.tr-row:last-child{border-bottom:0}
.li.done .mid b{text-decoration:line-through;color:var(--tx3)}
.main-w>.blob{position:absolute;z-index:0}
.fin .main-w>.blob.b2{left:auto;right:12%;top:560px}
.scrollx{overflow-x:auto}
@media (max-width:900px){.dg.c12{grid-template-columns:minmax(0,1fr)}.dg.c12>*{grid-column:auto!important}.main-w{padding:24px 16px 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
