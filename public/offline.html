<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F0E1">
<title>Sem conexão · Amora</title>
<style>
  :root{--bg:#F7F0E1;--surf:#FFFCF5;--tx:#4A3B33;--tx2:#62524A;--coral:#A63E29;--grid:rgba(139,111,78,.10)}
  @media (prefers-color-scheme:dark){:root{--bg:#2B221D;--surf:#372C25;--tx:#F3E8D8;--tx2:#D6C5B0;--coral:#F2917A;--grid:rgba(255,236,205,.05)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--tx);font:500 16px/1.5 Georgia,serif}
  main{max-width:380px;padding:32px;border-radius:24px;background:var(--surf);box-shadow:0 2px 6px rgba(74,59,51,.08),0 16px 36px rgba(74,59,51,.14);text-align:center}
  h1{margin:0 0 8px;font-size:28px;color:var(--coral)}
  p{margin:0 0 20px;color:var(--tx2)}
  a{display:inline-block;padding:12px 20px;border-radius:14px;background:#BE4B33;color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>Sem conexão</h1>
  <p>O Amora precisa de internet para abrir o seu caderno. Assim que a conexão voltar, é só tentar de novo.</p>
  <a href="/hoje">Tentar de novo</a>
</main>
</body>
</html>
